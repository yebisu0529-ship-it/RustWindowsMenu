# RustWindowsMenu v0.2.0 configuration
# Copy to %APPDATA%\RustWindowsMenu\config.toml or run `rwm config init`.
# Emergency kill switch: create an empty file at %LOCALAPPDATA%\RustWindowsMenu\DISABLE_HOOK.

# Master switch for accelerated menus.
enabled = true

# Build the native menu as soon as the right mouse button is pressed.
prebuild_on_rbuttondown = true

# Delay before arming the accelerator, in milliseconds (1-100; Windows SetTimer floor is ~10-15 ms).
arm_delay_ms = 15

# Disable popup animation for the most immediate visual response.
no_animation = true

# Keep handler DLLs pinned inside explorer.exe until all attached views detach.
pin_handler_dlls = true

# Maximum number of pinned handler DLLs (0-128).
max_pinned_dlls = 32

# Keep Explorer's native menu fallback enabled when acceleration cannot safely run.
classic_menu_fallback = false

# Write debug diagnostic logs when RWM_LOG is not explicitly set.
debug_logging = false
