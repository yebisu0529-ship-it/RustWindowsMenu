# RustWindowsMenu v0.4.1 configuration
# Copy to %APPDATA%\RustWindowsMenu\config.toml or run `rwm config init`.
# Emergency kill switch: create an empty file at %LOCALAPPDATA%\RustWindowsMenu\DISABLE_HOOK.

# Master switch for accelerated menus.
enabled = true

# Build the native menu as soon as the right mouse button is pressed.
prebuild_on_rbuttondown = true

# Delay before arming the in-process fallback prebuilder, in milliseconds (0-100).
arm_delay_ms = 15

# Disable popup animation for instant visual presentation.
no_animation = true

# Keep handler DLLs pinned inside explorer.exe and rwm-host.exe to avoid reload jitter.
pin_handler_dlls = true

# Maximum number of pinned handler DLLs (0-128).
max_pinned_dlls = 32

# Keep Explorer's native menu fallback enabled when acceleration cannot safely run.
classic_menu_fallback = false

# Write debug diagnostic logs when RWM_LOG is not explicitly set.
debug_logging = false

# Speculatively prebuild the next menu off Explorer's UI thread while hovering an item.
hover_prebuild = true

# Hover dwell time before speculative prefetch starts, in milliseconds (40-1000).
hover_delay_ms = 120

# Speculatively prebuild off-thread when keyboard or left-click selection changes.
selection_prebuild = true

# Enable out-of-process prebuilt menu cache inside rwm-host.exe for 1-5 ms right-click hits.
host_menu_cache = true

# Number of prebuilt local filesystem menus retained in rwm-host LRU cache (1-16).
host_cache_entries = 6

# Cache entry lifetime in milliseconds before invalidation (1000-30000).
host_cache_ttl_ms = 8000

# Append "Customize Menu (RWM)..." / "メニューをカスタマイズ (RWM)..." at the bottom of right-click menus.
show_customize_entry = true

# Menu items hidden from right-click menus (e.g. "verb:pintohomefile" or "label:共有").
# Managed visually via right-click -> Customize Menu (RWM)... or `rwm ui`.
hidden_items = []
