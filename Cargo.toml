[workspace]
resolver = "2"
members = ["crates/rwm-core", "crates/rwm-hook", "crates/rwm-cli"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.4.0"
repository = "https://github.com/yebisu0529-ship-it/RustWindowsMenu"
description = "Ultra-fast Windows 11 classic-style right-click menu accelerator in Rust"

[workspace.dependencies]
windows = "0.58"
windows-core = "0.58"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
